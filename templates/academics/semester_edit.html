{% extends 'base.html' %}
{% block title %}Edit Semester – AcadGenie{% endblock %}
{% block nav_semesters %}active{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header"><strong>Edit Semester {{ semester.semester_number }}</strong></div>
      <div class="card-body p-4">

        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Semester Number</label>
            <input type="number" name="semester_number" min="1" max="12"
                   class="form-control" value="{{ semester.semester_number }}" required>
          </div>
          <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" name="is_completed" id="isCompletedEdit"
                   {% if semester.is_completed %}checked{% endif %}>
            <label class="form-check-label" for="isCompletedEdit">Mark as completed</label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'semester_list_html' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
