{% extends 'base.html' %}
{% block title %}Edit Subject – AcadGenie{% endblock %}
{% block nav_semesters %}active{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header"><strong>Edit Subject</strong></div>
      <div class="card-body p-4">

        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Subject Name</label>
            <input type="text" name="name" class="form-control"
                   value="{{ subject.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Subject Code</label>
            <input type="text" name="code" class="form-control"
                   value="{{ subject.code }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Credits</label>
            <input type="number" name="credits" class="form-control"
                   min="1" max="10" value="{{ subject.credits }}" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'subject_list_html' subject.semester.id %}"
               class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
